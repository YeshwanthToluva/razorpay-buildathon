[project]
name = "afin"
version = "0.1.0"
description = "Agent Influence in Finance — experimental revenue/payment recovery laboratory"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --timeout=60"
asyncio_mode = "auto"
markers = ["integration: touches the database"]
